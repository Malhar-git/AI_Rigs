spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:55433/airigs_db
    username: postgres
    password: postgres
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway for schema changes; Hibernate only validates mappings
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  sync:
    arena:
      run-on-startup: false
