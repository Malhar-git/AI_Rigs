spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/airigs_db
    username: postgres
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway or Liquibase for migrations, never 'update' in prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect