spring:
  profiles:
    active : dev
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://127.0.0.1:55433/airigs_db
    username: postgres
    password: postgres
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate # Use Flyway for schema changes; Hibernate only validates mappings
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  sync:
    arena:
      run-on-startup: false
    localscore:
      request-delay-ms: 1200
      request-max-retries: 3
      backfill:
        run-on-startup: false
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    max-token: 8192
